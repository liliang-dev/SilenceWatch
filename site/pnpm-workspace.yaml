# This directory is its own pnpm project, deliberately outside the application's
# workspace: the site's toolchain (Astro, an image library) must not enlarge the
# application's lockfile, its audit, its install-script allowlist or its Docker
# build. A workspace file here makes pnpm treat this directory as a root of its
# own, so none of those are shared — which also means the supply-chain settings
# the application's root file carries are repeated, and have to be.
packages: []

# Nothing a dependency ships runs at install time unless it is named here.
allowBuilds:
  # Astro's bundler fetches its platform binary this way.
  esbuild: true
  # The image library normally installs a prebuilt binary through optional
  # dependencies, and its install script is only a fallback for platforms
  # without one. Not needed on CI or on a developer machine.
  sharp: false

# An ignored build script is not a warning to scroll past: fail the install.
strictDepBuilds: true

# Do not install a version of anything published less than three days ago, for
# the reason given in the application's own pnpm-workspace.yaml.
minimumReleaseAge: 4320

# An advisory that has no fix to install. Listed here, with the reason, rather than
# left to fail CI for everyone or silenced by loosening the audit level.
auditConfig:
  ignoreGhsas:
    # GHSA-ch52-4w7c-c8xp — http-cache-semantics up to 4.2.0 (the latest release):
    # `max-stale` handling can disclose a cached response to another user. No
    # patched version has been published, so there is nothing to override to.
    # Reached only through astro, which uses it to cache remote image downloads
    # at build time; this site fetches no remote image, builds on a CI runner that
    # serves no one, and ships none of it — the output is static files. Revisit
    # when 4.2.1 exists: the ignore should then become an override, and go.
    - GHSA-ch52-4w7c-c8xp

# Advisories whose fix is a newer release of something an Astro dependency pins.
# Delete one as soon as its parent ships the fix.
overrides:
  # GHSA-68fv-2mgg-jv7q — source-map-js below 1.2.2 can be made to stall the event
  # loop by a crafted indexed source map. Reached by the build only (Astro, svgo,
  # css-tree), on source maps this site's own build produces.
  source-map-js@<1.2.2: '^1.2.2'
  # GHSA-rj75-hqrm-r3gf — postcss-selector-parser below 7.1.6 takes quadratic time
  # on a long flat selector. Reached through postcss-nested, which Starlight's code
  # blocks use at build time, on styles that ship with the theme.
  postcss-selector-parser@<7.1.6: '^7.1.6'
  # GHSA-587h-7wmj-h5pm, GHSA-698v-4r3x-3vcv, GHSA-r825-w8mm-5pxw — vite 8.3.0 to
  # 8.3.2 and the launch-editor it bundles: dev-server file probing and editor
  # command-line handling. Reached through Astro, which uses vite to build; the
  # published site is static files and contains none of it. Overridden because CI
  # fails from moderate up and the fix is a patch release.
  vite@>=8.3.0 <8.3.3: '^8.3.3'

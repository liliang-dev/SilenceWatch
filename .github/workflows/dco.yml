name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole PR range, so every commit is checked rather than just the tip.
          fetch-depth: 0

      - name: Every commit carries a Signed-off-by line
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          failed=0

          # --no-merges: a merge commit introduces no authored work of its own, and
          # the ones GitHub's "Update branch" button creates can never carry a
          # sign-off, so requiring one there only blocks branches that are trying
          # to catch up with main.
          for commit in $(git rev-list --no-merges "$base".."$head"); do
            author="$(git show -s --format='%an <%ae>' "$commit")"

            # A bot cannot certify the origin of anything: the DCO is a statement
            # about who wrote the code and under what right, and Dependabot has no
            # standing to make it. Provenance for these commits comes from the
            # maintainer who reviews and merges the PR. Matching requires both a
            # `[bot]` name and a github.com noreply address, which is the shape
            # GitHub itself mints for app identities:
            #   dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>
            case "$author" in
              *'[bot] <'*'@users.noreply.github.com>') continue ;;
            esac

            if git show -s --format='%B' "$commit" | grep -qiE "^Signed-off-by: .+ <.+@.+>$"; then
              continue
            fi
            echo "::error::Commit $commit by $author has no Signed-off-by line"
            failed=1
          done

          if [ "$failed" -ne 0 ]; then
            cat <<'HELP'

          Every commit must certify its origin (https://developercertificate.org/).
          Add the line by amending or rebasing with sign-off:

              git commit --amend -s --no-edit          # last commit
              git rebase --signoff origin/main         # a whole branch

          Committing from the GitHub web editor instead? Turn on Settings ->
          General -> "Require contributors to sign off on web-based commits",
          and GitHub adds the line for you on every web commit from then on.

          HELP
            exit 1
          fi

          echo "All commits are signed off."

name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole PR range, so every commit is checked rather than just the tip.
          fetch-depth: 0

      - name: Every commit carries a Signed-off-by line
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          failed=0

          for commit in $(git rev-list "$base".."$head"); do
            author="$(git show -s --format='%an <%ae>' "$commit")"
            if git show -s --format='%B' "$commit" | grep -qiE "^Signed-off-by: .+ <.+@.+>$"; then
              continue
            fi
            echo "::error::Commit $commit by $author has no Signed-off-by line"
            failed=1
          done

          if [ "$failed" -ne 0 ]; then
            cat <<'HELP'

          Every commit must certify its origin (https://developercertificate.org/).
          Add the line by amending or rebasing with sign-off:

              git commit --amend -s --no-edit          # last commit
              git rebase --signoff origin/main         # a whole branch

          HELP
            exit 1
          fi

          echo "All commits are signed off."

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A weekly run catches rules published after a commit was merged: most of
    # what CodeQL will ever tell you about this code does not exist yet.
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest

    permissions:
      # The only thing this workflow is allowed to write: findings.
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: github/codeql-action/init@dfbc6164313353db46c80e2fcfd38820bd2c3c46 # v3.37.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds the rules that are worth a false positive or
          # two on a project whose whole promise is being safe to host.
          queries: security-extended

      # Only the starter is Java. Building it explicitly is more predictable
      # than autobuild in a repository whose root is an npm workspace.
      - name: Build the starter
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compile
        if: matrix.language == 'java-kotlin'
        working-directory: clients/spring-boot-starter
        run: mvn -B -DskipTests compile

      - uses: github/codeql-action/analyze@dfbc6164313353db46c80e2fcfd38820bd2c3c46 # v3.37.4
        with:
          category: /language:${{ matrix.language }}

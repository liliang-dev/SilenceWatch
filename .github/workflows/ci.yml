name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Server, shared and web
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: silencewatch
          POSTGRES_PASSWORD: silencewatch
          POSTGRES_DB: silencewatch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U silencewatch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://silencewatch:silencewatch@localhost:5432/silencewatch_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build shared types
        run: npm run build:shared

      - name: Type-check
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Runs against a real PostgreSQL on purpose: the detection state machine,
      # FOR UPDATE SKIP LOCKED and the sync upsert live in SQL, and a mocked
      # database would test none of it.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build server and web
        run: npm run build:server && npm run build:web

  java:
    name: Spring Boot starter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: clients/spring-boot-starter
        run: mvn -B verify

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only: publishing happens from the release workflow.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: silencewatch:ci
          build-args: |
            SILENCEWATCH_VERSION=ci
            SILENCEWATCH_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only useful if it actually starts and reports healthy.
      - name: Smoke test the image
        run: |
          docker network create sw-ci
          docker run -d --name sw-db --network sw-ci \
            -e POSTGRES_USER=silencewatch -e POSTGRES_PASSWORD=silencewatch \
            -e POSTGRES_DB=silencewatch postgres:16-alpine
          for _ in $(seq 1 30); do
            docker exec sw-db pg_isready -U silencewatch && break
            sleep 2
          done

          docker run -d --name sw-app --network sw-ci -p 8080:8080 \
            -e DATABASE_URL=postgres://silencewatch:silencewatch@sw-db:5432/silencewatch \
            -e SECRET_KEY=ci-secret-key-that-is-long-enough-for-the-check \
            -e BASE_URL=http://localhost:8080 \
            silencewatch:ci

          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && break
            sleep 2
          done

          curl -fsS http://localhost:8080/health | tee /dev/stderr | grep -q '"status":"ok"'
          # A mistyped ping URL must be a 404, never the SPA shell.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/p/nope)" = "400"
          docker logs sw-app

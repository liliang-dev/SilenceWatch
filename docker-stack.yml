# Docker Swarm stack. Deployed by .github/workflows/release.yml on a tag, and by
# hand with:
#
#   set -a; . /opt/silencewatch/.env; set +a
#   SILENCEWATCH_VERSION=0.1.0 docker stack deploy -c docker-stack.yml silencewatch
#
# This is not docker-compose.yml with a `deploy:` block bolted on. `docker stack
# deploy` silently ignores several keys that file relies on — `depends_on`,
# `restart`, and the short form of `tmpfs` among them — so the differences below
# are deliberate, and each one is a bug avoided rather than a preference.
version: '3.8'

services:
  silencewatch:
    image: ghcr.io/liliang-dev/silencewatch:${SILENCEWATCH_VERSION:?SILENCEWATCH_VERSION is required}

    # Two replicas is what makes a zero-downtime update possible at all: with
    # one, `start-first` still leaves a window where the only healthy task is
    # the one being replaced. Running two is safe here by design rather than by
    # luck — the detection loop and the alert queue claim rows with
    # `FOR UPDATE SKIP LOCKED`, so instances share work instead of duplicating
    # alerts, and the ingest cache is invalidated across them by LISTEN/NOTIFY.
    deploy:
      replicas: 2
      update_config:
        # The whole point. `start-first` brings the new task up and waits for it
        # to pass the image's HEALTHCHECK before the old one is stopped, so
        # there is never a moment with no healthy task behind the routing mesh.
        order: start-first
        parallelism: 1
        # Long enough for the health check to have a real opinion: the image
        # allows a 20s start period and 3 retries at 30s.
        monitor: 120s
        delay: 15s
        # If the new version cannot become healthy, Swarm puts the old one back
        # on its own. The deploy job then fails on the version check, so a
        # rolled-back deploy is a red build rather than a silent no-op.
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
        delay: 5s
      # Keep the application off the database node, so a burst of CRUD cannot
      # starve PostgreSQL of CPU on the one machine that cannot be moved.
      # Delete this if the swarm is a single node.
      placement:
        preferences:
          - spread: node.id

    ports:
      - target: 8080
        published: ${PORT:-8080}
        protocol: tcp
        mode: ingress

    environment:
      DATABASE_URL: postgres://silencewatch:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/silencewatch
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      BASE_URL: ${BASE_URL:?BASE_URL is required}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_URL: ${SMTP_URL:-}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-alerts@example.com}
      OUTBOUND_HEARTBEAT_URL: ${OUTBOUND_HEARTBEAT_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PING_RETENTION_DAYS: ${PING_RETENTION_DAYS:-90}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      UNVERIFIED_ACCOUNT_TTL_DAYS: ${UNVERIFIED_ACCOUNT_TTL_DAYS:-7}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-60}
      SIGNUP_POW_DIFFICULTY: ${SIGNUP_POW_DIFFICULTY:-0}
      SIGNUP_BLOCK_DISPOSABLE_EMAIL: ${SIGNUP_BLOCK_DISPOSABLE_EMAIL:-false}
      SIGNUP_BLOCKED_EMAIL_DOMAINS: ${SIGNUP_BLOCKED_EMAIL_DOMAINS:-}
      SIGNUP_MAX_PER_NETWORK_PER_HOUR: ${SIGNUP_MAX_PER_NETWORK_PER_HOUR:-0}
      QUOTAS_ENABLED: ${QUOTAS_ENABLED:-false}
      DEFAULT_PLAN: ${DEFAULT_PLAN:-free}
      PLAN_LIMITS: ${PLAN_LIMITS:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-SilenceWatch}
      ALLOW_PRIVATE_NOTIFICATION_TARGETS: ${ALLOW_PRIVATE_NOTIFICATION_TARGETS:-false}

    # `depends_on` is ignored by `docker stack deploy`, so the application will
    # sometimes start before PostgreSQL accepts connections. That is already
    # handled: the entrypoint retries migrations with backoff, and says which
    # attempt failed rather than calling everything "database not ready".
    read_only: true
    # The long form on purpose. `tmpfs: [/tmp]` is one of the keys stack deploy
    # drops, and a read-only container with no writable /tmp does not start —
    # a failure that would look like the release being broken.
    volumes:
      - type: tmpfs
        target: /tmp

    # Time for in-flight requests to finish before SIGKILL. Ingestion writes are
    # short; this is generous on purpose, since it costs nothing when unused.
    stop_grace_period: 30s

    networks:
      - silencewatch

  db:
    image: postgres:16-alpine

    deploy:
      replicas: 1
      # Pinned to one node by label. Without this a reschedule would start
      # PostgreSQL on another machine, against an empty local volume — an
      # instance that looks healthy and has lost every check, ping and account.
      # Label the node once:
      #   docker node update --label-add silencewatch.db=true <node>
      placement:
        constraints:
          - node.labels.silencewatch.db == true
      update_config:
        # Never start-first for the database. Two PostgreSQL processes on one
        # data directory corrupt it; the brief pause here is the correct trade,
        # and the application rides it out because its own tasks stay up and
        # retry.
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

    environment:
      POSTGRES_USER: silencewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: silencewatch

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U silencewatch -d silencewatch']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - silencewatch

  # HTTPS. Unlike the Compose file there is no profile to hide it behind —
  # Swarm has none — and a deployment reached over the internet wants TLS
  # anyway. It needs SILENCEWATCH_DOMAIN pointing at this swarm, with 80 and
  # 443 reachable, which is how Caddy proves control of the name.
  #
  # Optionally it also serves a static site on a second name, SILENCEWATCH_SITE_DOMAIN
  # — the hosted service's showcase and documentation, which live on the bare
  # domain while the application lives on `app.`. Left unset, nothing about that
  # exists: no second block, no redirect, and the `site` volume stays empty and
  # unused. Self-hosters set one name and are unaffected.
  caddy:
    image: caddy:2-alpine
    # The Caddyfile is written at start rather than shipped as a swarm config
    # object, which `docker stack deploy -c -` (how the release workflow deploys)
    # cannot carry and which would have to reach every node. For the application
    # it says what `caddy reverse-proxy --from <domain> --to silencewatch:8080`
    # said — that command is a Caddyfile with those two lines — plus two more,
    # both about HTTP/3:
    #
    #  - `protocols h1 h2` stops Caddy serving it, and with it stops Caddy telling
    #    browsers to use it. Caddy advertises HTTP/3 with `Alt-Svc: h3=":443";
    #    ma=2592000`, which a browser remembers for thirty days. QUIC is UDP, and
    #    through the routing mesh (IPVS and NAT on the way in) it is the one
    #    transport here that is not reliable: a browser that tries it can sit on
    #    requests it never manages to send, then fall back to TCP only after it
    #    has marked QUIC broken for five minutes. The same browser on a phone,
    #    or `curl`, which never tries QUIC, shows nothing wrong at all.
    #  - `Alt-Svc: clear` tells browsers that already learned the old
    #    advertisement to forget it on their next visit, rather than keep
    #    trying until it expires.
    #
    # The site block, when there is one:
    #
    #  - serves /srv/site/live, a symlink the site's deploy job moves to a freshly
    #    unpacked directory, so a visitor never sees a half-written site;
    #  - sends the addresses the application used to answer on the bare domain
    #    (/p/…, /api/…, /login and the rest) to the application's name, with a 308
    #    so a POST stays a POST. Nothing links there any more; this is for the
    #    bookmark, the verification email sent before the move, and a crontab
    #    that has not been updated;
    #  - sets its own security headers. The site is static and loads nothing from
    #    anywhere else, but Starlight writes small inline scripts and styles and
    #    its search runs WebAssembly, hence the two relaxations in the policy
    #    that the application's own policy does not make;
    #  - redirects `www.` to the bare name.
    #
    # `$$` is how this file spells a literal `$`, so that the shell inside the
    # container, not `docker stack deploy`, expands it.
    command:
      - sh
      - -c
      - |
        {
          printf '{\n  servers {\n    protocols h1 h2\n  }\n}\n\n'
          printf '%s {\n  header Alt-Svc clear\n  reverse_proxy silencewatch:8080\n}\n' "$$SILENCEWATCH_DOMAIN"
        } > /tmp/Caddyfile
        if [ -n "$$SILENCEWATCH_SITE_DOMAIN" ]; then
        cat >> /tmp/Caddyfile <<EOF

        $$SILENCEWATCH_SITE_DOMAIN {
          header Alt-Svc clear
          encode zstd gzip

          @legacy path /p/* /api/* /health /login /checks /checks/* /channels /settings /verify-email /reset-password
          redir @legacy https://$$SILENCEWATCH_DOMAIN{uri} 308

          header {
            Strict-Transport-Security "max-age=31536000"
            X-Content-Type-Options nosniff
            Referrer-Policy strict-origin-when-cross-origin
            Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
          }

          @immutable path /_astro/*
          header @immutable Cache-Control "public, max-age=31536000, immutable"

          root * /srv/site/live
          file_server

          handle_errors {
            rewrite * /404.html
            file_server
          }
        }

        www.$$SILENCEWATCH_SITE_DOMAIN {
          redir https://$$SILENCEWATCH_SITE_DOMAIN{uri} 301
        }
        EOF
        fi
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    environment:
      SILENCEWATCH_DOMAIN: ${SILENCEWATCH_DOMAIN:?SILENCEWATCH_DOMAIN is required}
      SILENCEWATCH_SITE_DOMAIN: ${SILENCEWATCH_SITE_DOMAIN:-}

    deploy:
      replicas: 1
      # Pinned like the database, and for the same reason: the certificates are
      # in a local volume. A task rescheduled elsewhere would find it empty and
      # ask Let's Encrypt for a fresh certificate, which is rate-limited.
      placement:
        constraints:
          - node.labels.silencewatch.db == true
      update_config:
        # Not start-first. Two tasks cannot both hold ports 80 and 443, and two
        # Caddy processes sharing one certificate store is asking for trouble.
        # The gap is a second or two, and only when Caddy itself changes — the
        # application behind it updates without ever going through this.
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

    ports:
      - target: 80
        published: 80
        mode: ingress
      # TCP only. 443/udp was published for HTTP/3, which is switched off above.
      - target: 443
        published: 443
        mode: ingress

    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Read-only: Caddy serves the site and never writes to it. The deploy job
      # fills it (.github/workflows/site.yml).
      - site:/srv/site:ro

    networks:
      - silencewatch

networks:
  silencewatch:
    driver: overlay
    attachable: false
    # Fixed so TRUST_PROXY can name it. The server rejects `TRUST_PROXY=true` in
    # production — a bare true lets anything able to reach the port forge its
    # own client address — so it needs the CIDR the proxy speaks from, and an
    # automatically assigned one differs between swarms.
    ipam:
      config:
        - subnet: ${SWARM_SUBNET:-10.20.0.0/16}

volumes:
  pgdata:
    # Local to the node the constraint above pins the database to. Moving the
    # database to another node means moving this volume with it, deliberately.
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  # The static site, when SILENCEWATCH_SITE_DOMAIN is set. Local to the node
  # Caddy is pinned to, like its certificates.
  site:
    driver: local

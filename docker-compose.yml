services:
  silencewatch:
    # Pinned rather than `latest`: an instance should not change version because
    # it happened to restart, and "which version is this?" must have an answer
    # when something is wrong. Upgrading is editing this line, then
    # `docker compose pull && docker compose up -d`.
    image: ghcr.io/liliang-dev/silencewatch:0.1.0
    # Working from a checkout instead? Comment the line above and uncomment
    # these; nothing else in this file changes.
    # build:
    #   context: .
    #   args:
    #     SILENCEWATCH_VERSION: dev
    restart: unless-stopped
    ports:
      # Published on every interface by default, which is what makes
      # `docker compose up -d` reachable with nothing else configured. Behind
      # the TLS profile below, set BIND_ADDRESS=127.0.0.1 so only Caddy can
      # reach it and the plain-HTTP port stops being a way around it.
      - '${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080'
    environment:
      DATABASE_URL: postgres://silencewatch:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/silencewatch
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env — openssl rand -hex 32}
      # Public URL: it is what ping URLs and alert links are built from, so it
      # has to be what your users actually type.
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_URL: ${SMTP_URL:-}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-alerts@example.com}
      OUTBOUND_HEARTBEAT_URL: ${OUTBOUND_HEARTBEAT_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PING_RETENTION_DAYS: ${PING_RETENTION_DAYS:-90}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: silencewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: silencewatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U silencewatch -d silencewatch']
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published: only the application needs to reach it. Uncomment to attach
    # psql from the host.
    # ports:
    #   - '127.0.0.1:5432:5432'
    security_opt:
      - no-new-privileges:true

  # HTTPS, and nothing else. Behind a Compose profile, so it does not exist
  # unless asked for: `docker compose up -d` starts exactly what it started
  # before this service was added, and the simple path stays one command and a
  # .env file.
  #
  #   docker compose --profile tls up -d
  #
  # Requires SILENCEWATCH_DOMAIN to be a real hostname pointing at this machine,
  # with ports 80 and 443 reachable — Caddy proves control of the name over both
  # to obtain the certificate, then renews it on its own.
  caddy:
    profiles: ['tls']
    image: caddy:2-alpine
    restart: unless-stopped
    # No Caddyfile: this one line is the whole configuration, and a file would
    # be one more thing to mount here and distribute to every node in Swarm.
    # Automatic HTTPS comes from `--from` being a hostname rather than a port.
    command: caddy reverse-proxy --from ${SILENCEWATCH_DOMAIN:?set SILENCEWATCH_DOMAIN in .env, e.g. status.example.com} --to silencewatch:8080
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      # Certificates and account keys. Losing this volume means re-issuing on
      # next start, which Let's Encrypt rate-limits — keep it.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      silencewatch:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

networks:
  # Declared with a fixed subnet so TRUST_PROXY can name it. The server refuses
  # `TRUST_PROXY=true` in production on purpose — a bare true lets anything able
  # to reach the port forge its own client address — so it needs the CIDR the
  # proxy actually speaks from, and a Docker-assigned one changes between hosts.
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/16}

volumes:
  pgdata:
  caddy_data:
  caddy_config:

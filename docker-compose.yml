services:
  silencewatch:
    # Built from this checkout. No image is published yet, so pointing at a
    # registry here would make `docker compose up` fail on a fresh clone with
    # nothing running at all — which looks a lot like a missing application.
    # Once a release is published, swap this for the image line below.
    build:
      context: .
      args:
        SILENCEWATCH_VERSION: dev
    # image: ghcr.io/liliang-dev/silencewatch:latest
    restart: unless-stopped
    ports:
      - '${PORT:-8080}:8080'
    environment:
      DATABASE_URL: postgres://silencewatch:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/silencewatch
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env — openssl rand -hex 32}
      # Public URL: it is what ping URLs and alert links are built from, so it
      # has to be what your users actually type.
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_URL: ${SMTP_URL:-}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-alerts@example.com}
      OUTBOUND_HEARTBEAT_URL: ${OUTBOUND_HEARTBEAT_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PING_RETENTION_DAYS: ${PING_RETENTION_DAYS:-90}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: silencewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: silencewatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U silencewatch -d silencewatch']
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published: only the application needs to reach it. Uncomment to attach
    # psql from the host.
    # ports:
    #   - '127.0.0.1:5432:5432'
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:

<!-- SilenceWatch. The favicon: the black tile, and the white one when the browser is in dark mode.
     Drawn in vector, in black and white: a monitor on its stand, a heartbeat across
     the screen, and the status dot at its corner.
     The name and the logo are not under the Apache License: see TRADEMARK.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="SilenceWatch">
  <style>
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: inline; }
    }
  </style>
  <g class="light">
  <rect x="8" y="8" width="240" height="240" rx="58" fill="#0a0a0a"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <rect x="50" y="62" width="156" height="108" rx="20" stroke-width="13"/>
    <path d="M78 117h24l12-25l20 50l14-33l8 8h26" stroke-width="12"/>
    <path d="M128 172v18M98 196h60" stroke-width="13"/>
  </g>
  <circle cx="200" cy="166" r="27" fill="#0a0a0a"/>
  <circle cx="200" cy="166" r="16" fill="#ffffff"/></g>
  <g class="dark">
  <rect x="8" y="8" width="240" height="240" rx="58" fill="#ffffff"/>
  <g fill="none" stroke="#0a0a0a" stroke-linecap="round" stroke-linejoin="round">
    <rect x="50" y="62" width="156" height="108" rx="20" stroke-width="13"/>
    <path d="M78 117h24l12-25l20 50l14-33l8 8h26" stroke-width="12"/>
    <path d="M128 172v18M98 196h60" stroke-width="13"/>
  </g>
  <circle cx="200" cy="166" r="27" fill="#ffffff"/>
  <circle cx="200" cy="166" r="16" fill="#0a0a0a"/></g>
</svg>

<section class="sw-card section">
  <div class="section-head with-action">
    <div>
      <h2>{{ t('settings.projectsTitle') }}</h2>
      <p class="sw-muted">{{ t('settings.projectsBody') }}</p>
    </div>
    <button
      mat-flat-button
      type="button"
      class="sw-header-add"
      [disabled]="projectBusy()"
      [attr.aria-label]="t('settings.newProject')"
      (click)="createProject()"
    >
      <sw-icon name="add" />
      <span class="sw-header-add-label">{{ t('settings.newProject') }}</span>
    </button>
  </div>

  <div class="rows">
    @for (project of projects.all(); track project.id) {
      <!-- A click anywhere on the row shows this project, as the picker in the header would. The two
           buttons at its end do their own thing and are not part of it (see `show`). -->
      <div
        class="row"
        [class.selected]="project.id === projects.selected()?.id"
        (click)="show(project, $event)"
      >
        <span class="glyph" aria-hidden="true"><sw-icon name="project" /></span>

        <button
          type="button"
          class="row-main"
          [attr.aria-label]="t('settings.showProjectAria', { name: project.name })"
          [attr.aria-pressed]="project.id === projects.selected()?.id"
        >
          <span class="row-title">
            <strong>{{ project.name }}</strong>
            @if (project.id === projects.selected()?.id) {
              <span class="sw-tag current">{{ t('settings.currentProject') }}</span>
            }
          </span>
          <span class="row-slug sw-mono">{{ project.slug }}</span>
        </button>

        <span class="row-count">{{ plural('settings.checkCount', project.checkCount ?? 0) }}</span>

        <div class="row-actions">
          <button
            mat-icon-button
            type="button"
            class="sw-icon-button"
            [attr.aria-label]="t('settings.renameAria')"
            [matTooltip]="t('settings.renameTip')"
            (click)="renameProject(project); $event.stopPropagation()"
          >
            <sw-icon name="edit" />
          </button>
          <button
            mat-icon-button
            type="button"
            class="sw-icon-button danger"
            [attr.aria-label]="t('settings.deleteProjectAria')"
            [disabled]="projects.all().length < 2"
            [matTooltip]="
              projects.all().length < 2
                ? t('settings.lastProjectTip')
                : t('settings.deleteProjectTip')
            "
            matTooltipPosition="left"
            (click)="deleteProject(project); $event.stopPropagation()"
          >
            <sw-icon name="delete" />
          </button>
        </div>
      </div>
    }
  </div>
</section>

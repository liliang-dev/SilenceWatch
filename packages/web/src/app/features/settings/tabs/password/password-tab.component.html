<section class="sw-card section">
  <div class="section-head">
    <h2>{{ t('settings.passwordTitle') }}</h2>
    <p class="sw-muted">{{ t('settings.passwordBody') }}</p>
  </div>
  <div class="section-body">
    <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="password-form">
      <mat-form-field appearance="outline">
        <mat-label>{{ t('settings.currentPassword') }}</mat-label>
        <input
          matInput
          type="password"
          formControlName="currentPassword"
          autocomplete="current-password"
        />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>{{ t('settings.newPassword') }}</mat-label>
        <input
          matInput
          type="password"
          formControlName="newPassword"
          autocomplete="new-password"
        />
        <mat-hint>{{ t('settings.passwordHint', { count: minLength }) }}</mat-hint>
      </mat-form-field>
      <button mat-flat-button type="submit" [disabled]="busy()" class="tall">
        {{ t('settings.changePassword') }}
      </button>
    </form>
  </div>
</section>

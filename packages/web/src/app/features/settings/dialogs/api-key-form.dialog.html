<h2 mat-dialog-title class="title">{{ t('settings.newKey') }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="save()" class="sw-form body">
    <mat-form-field appearance="outline">
      <mat-label>{{ t('settings.keyName') }}</mat-label>
      <input
        matInput
        formControlName="name"
        placeholder="spring-boot-starter"
        required
        cdkFocusInitial
      />
    </mat-form-field>

    @if (error()) {
      <p class="sw-error" role="alert">{{ error() }}</p>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="actions">
  <button mat-button type="button" (click)="dialogRef.close()">{{ t('common.cancel') }}</button>
  <button mat-flat-button type="button" [disabled]="busy()" (click)="save()">
    {{ t('settings.createKey') }}
  </button>
</mat-dialog-actions>

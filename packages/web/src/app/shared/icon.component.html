<svg
    [attr.viewBox]="viewBox()"
    [attr.width]="px()"
    [attr.height]="px()"
    [attr.fill]="variant() === 'outline' ? 'none' : 'currentColor'"
    [attr.stroke]="variant() === 'outline' ? 'currentColor' : null"
    [attr.stroke-width]="variant() === 'outline' ? 1.5 : null"
    aria-hidden="true"
    focusable="false"
    [innerHTML]="path()"
  ></svg>

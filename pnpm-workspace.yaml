# pnpm workspace, and the supply-chain settings that go with it.
#
# Everything below the package list is here rather than in `.npmrc` on purpose:
# pnpm reads its own settings from this file, it is checked in, and it applies
# to every contributor and to CI without anyone having to remember a flag.

packages:
  - packages/shared
  - packages/server
  - packages/web

# --- supply chain ------------------------------------------------------------

# Nothing a dependency ships runs at install time unless it is named here.
#
# This is the attack that actually happens: a maintainer account is taken over,
# a patch release is published with a `postinstall` that reads ~/.npmrc and the
# environment, and every machine that installs in the next few hours ships its
# credentials somewhere. pnpm blocks dependency lifecycle scripts by default;
# this list is the deliberate exception, and each entry is a package that
# genuinely cannot work without one.
# Explicitly false rather than absent: a decision that was made, so a future
# reader does not have to work out whether the package was considered.
allowBuilds:
  # Places the Prisma query and schema engines. Without these two there is no
  # client to generate and no migrations to apply — the image would not start.
  '@prisma/engines': true
  prisma: true
  # Fetch the platform-specific native binary they exist to wrap. Both are on
  # the Angular build path, and neither has a usable JavaScript fallback.
  esbuild: true
  unrs-resolver: true
  # Optional accelerators, all three of them, and all three degrade to
  # something that works: file watching falls back to polling (which only
  # affects `ng serve`), and Angular's build cache falls back to memory.
  # Nothing in CI or in the image depends on them.
  '@parcel/watcher': false
  lmdb: false
  msgpackr-extract: false

# An ignored build script is not a warning to scroll past: it means something
# that needed to run did not, and the failure will surface later as a missing
# binary. Fail the install instead, so the list above stays honest.
strictDepBuilds: true

# Do not install a version of anything that was published less than three days
# ago.
#
# Every large npm compromise so far — the chalk/debug takeover, Shai-Hulud —
# was published, noticed and unpublished inside a day. This does not make a
# malicious package safe; it moves the window in which we would install one to
# after the point where the ecosystem has usually noticed. The cost is that a
# genuine fix released this morning cannot be picked up until Thursday, which
# is the right trade for a dependency and the wrong one for an emergency —
# override it deliberately with `--minimum-release-age=0` when that day comes.
minimumReleaseAge: 4320

# --- forced resolutions -------------------------------------------------------
# Each entry is an advisory that a direct dependency has not yet picked up.
# Delete one as soon as its parent ships the fix: an override that outlives the
# reason for it silently pins a version nobody is choosing any more.
overrides:
  # GHSA-c96f-x56v-gq3h — @nestjs/platform-fastify still asks for 9.6.0, while
  # fastify itself has moved to 9.7.0. Not exploitable here (nothing serves
  # HTTP/2) but it is one resolution away, and it deduplicates the router.
  find-my-way@<9.6.1: '^9.7.0'

  # GHSA-w5hq-g745-h8pq — uuid writes past the end of a caller-supplied buffer.
  # Reached only through autocannon, the load-testing tool, which is a dev
  # dependency and never runs against attacker input. Overridden anyway: the fix
  # is a patch release, and an advisory left open is an advisory nobody reads.
  uuid@<11.1.1: '^11.1.1'

  # GHSA-frvp-7c67-39w9 — path traversal in @hono/node-server's static handler
  # on Windows. It arrives through @angular/cli's MCP server, which is a
  # development tool and is not part of the built application, so nothing we
  # ship contains it. Same reasoning: cheap to resolve, so resolve it.
  '@hono/node-server@<2.0.5': '^2.0.5'

  # GHSA-2v37-7h3g-55p8 — a custom nanoid generator loops forever when asked
  # for size zero. It reaches us eleven ways and every one of them is postcss
  # inside a build tool (@nestjs/cli, @angular/build, vite), so nothing we ship
  # contains it and nothing we run feeds it attacker-controlled input. Still
  # worth the one line: it is rated high, the fix is a patch release, and CI
  # fails the build on anything moderate or above.
  nanoid@<3.3.18: '^3.3.18'

  # GHSA-ggr8-5vv4-36mx — deepmerge-ts below 8 exhausts the stack on a
  # recursive object graph. Unlike the others here this one does ship: it
  # arrives through @prisma/client and the prisma CLI, both runtime
  # dependencies, and the image's --prod install keeps them because the
  # entrypoint runs `prisma migrate deploy` at start.
  #
  # What it merges is prisma.config.ts — our own checked-in file, never
  # attacker input — so the practical risk is nil. It is overridden because CI
  # fails from moderate up, and because @prisma/config pins 7.1.5 exactly,
  # which means Prisma will not pick the fix up on its own.
  #
  # Forcing a major past an exact pin is the risky kind of override, so it is
  # verified rather than assumed: prisma generate, prisma migrate deploy and
  # the end-to-end suite all run against it below. Delete this when Prisma
  # ships a version asking for deepmerge-ts 8.
  'deepmerge-ts@<8.0.0': '^8.0.0'

  # GHSA-p68q-wchp-6fh7, -667r-xxjv-c9mm, -hwr6-493r-vm6h, -9q9j-q6p8-xq58 and
  # three more — fastify below 5.12.5. Among them an authentication bypass via
  # malformed URLs reaching encapsulated routes, and three ways around request
  # validation.
  #
  # This is the HTTP server itself, and bumping our own `fastify` dependency
  # does not touch it: @nestjs/platform-fastify pins fastify EXACTLY, to 5.11.3
  # for the entire Nest 11 line (11.2.7 included), and it is the adapter that
  # builds the instance that serves requests. Ours was a second copy, used for
  # types. The first release that carries a fixed fastify is Nest 12, which is
  # ESM-only — the server is CommonJS, and 76 of the 78 type errors that
  # produces are TS1479 — so that is a migration, not a bump.
  #
  # Forcing a minor past an exact pin, on the HTTP core, is the risky kind of
  # override, so it is verified by running it rather than by the audit going
  # quiet: the whole end-to-end suite goes through Nest's adapter, and the
  # container image boots it. It also leaves one fastify instead of two.
  # Delete this when the server moves to Nest 12, whose adapter pins >=5.12.5.
  'fastify@<5.12.5': '^5.12.5'

  # GHSA-5jgf-p345-68v8, -f65p-4m7j-42xc, -fph4-wmhf-6fwf, -jqff-g426-hqxp,
  # -qw65-cvwx-89v3, -hrr3-gc8f-f4qj — fast-uri: host confusion and SSRF through
  # URL normalisation. It ships: ajv and fast-json-stringify reach it through
  # fastify, which validates and serialises every request. Not an exact pin and
  # not a major — two lines, 3.x and 4.x, each moved to its own patched patch
  # release, because one selector would drag the 3.x users onto 4.
  'fast-uri@>=3.0.0 <3.1.8': '^3.1.8'
  'fast-uri@>=4.0.0 <4.1.5': '^4.1.5'

  # GHSA-3f6p-5ww8-9rcr, -rgwj-5xj2-c3m3 — mysql2 leaks credentials on an auth
  # plugin downgrade, and inflates compressed packets without a bound. It ships,
  # because `prisma` is a runtime dependency that bundles the MySQL driver, and
  # it is pinned EXACTLY to 3.15.3 by prisma, which is the reason prisma cannot
  # take the fix itself. This application talks to PostgreSQL and nothing in the
  # source or schema mentions MySQL, so the driver is never connected — the
  # advisory is unreachable. Overridden anyway, and verified the way the
  # deepmerge-ts override was, by running prisma along the path it crosses.
  'mysql2@<3.23.1': '^3.23.1'

  # GHSA-qhr7-859c-m2p7, -6j4f-fj2g-mc7p, -q2hr-2g5m-vwhr and six more —
  # brace-expansion: stack exhaustion and quadratic expansion. The runtime copy
  # is 5.x, reached through @fastify/static > glob > minimatch; the 1.x and 2.x
  # copies belong to build tooling. Three selectors, one per major, each to its
  # own patched release: they are different codebases that share a name.
  'brace-expansion@>=1.0.0 <1.1.21': '^1.1.21'
  'brace-expansion@>=2.0.0 <2.1.7': '^2.1.7'
  'brace-expansion@>=5.0.0 <5.0.12': '^5.0.12'

  # GHSA — js-yaml 3.x and 4.x, below 3.15.2 and 4.3.2. Reached only through
  # cosmiconfig inside @nestjs/cli's type-checker, which is build tooling, so
  # nothing shipped contains it. Taken for the same reason as the others: CI
  # fails from moderate up, and the fix is a patch release in each line.
  'js-yaml@>=3.0.0 <3.15.2': '^3.15.2'
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'


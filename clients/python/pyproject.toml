[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "silencewatch"
dynamic = ["version"]
description = "Declare and monitor the scheduled jobs of a Python application with SilenceWatch: Celery beat, django-celery-beat, APScheduler."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "The SilenceWatch authors" }]
keywords = ["monitoring", "cron", "celery", "django-celery-beat", "apscheduler", "heartbeat", "dead-mans-switch", "silencewatch"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
# No runtime dependency, on purpose: the library sits inside someone else's
# application, and the standard library is enough to send a few small requests.
dependencies = []

[project.optional-dependencies]
celery = ["celery>=5.2"]
apscheduler = ["apscheduler>=3.9,<4"]
django-celery-beat = ["celery>=5.2", "django-celery-beat>=2.5"]

[project.urls]
Homepage = "https://silencewatch.com/python/"
Documentation = "https://silencewatch.com/docs/python/"
Source = "https://github.com/liliang-dev/SilenceWatch/tree/main/clients/python"
Changelog = "https://github.com/liliang-dev/SilenceWatch/blob/main/clients/python/CHANGELOG.md"

[tool.hatch.version]
path = "src/silencewatch/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/silencewatch"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT"]
# Optional[...] and typing.Dict stay: the supported Python is 3.9, and they are real at runtime
# in the few places that are not annotations.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "apscheduler", "apscheduler.*", "django", "django.*", "django_celery_beat", "django_celery_beat.*"]
ignore_missing_imports = true
